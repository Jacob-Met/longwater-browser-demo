name: smoke

on:
  push:
    branches: [longwater-demo]
  pull_request:
    branches: [longwater-demo]

# A bad push here breaks the live demo for visitors, so keep this cheap and
# fast: syntax-check the UI script and confirm every asset the page loads
# actually exists and is non-empty.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: JS syntax check
        run: node --check game.js
      - name: Referenced assets exist and are non-empty
        run: |
          set -e
          # .nojekyll is legitimately empty; everything else must be non-empty.
          test -e .nojekyll || { echo "missing: .nojekyll"; exit 1; }
          for f in index.html style.css game.js journal.js journal.css watch-save.js watch-save.css \
                   pkg/longwater_web.js pkg/longwater_web.d.ts \
                   pkg/longwater_web_bg.wasm pkg/longwater_web_bg.wasm.d.ts; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q '\./pkg/longwater_web.js' game.js
          grep -q '\./game.js' index.html
          grep -q '\./style.css' index.html
          echo "smoke OK"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Play and resume the real WASM watch, including offline packaging
        run: npm test
      - name: Preserve historical-choice receiving artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-choice-${{ github.sha }}
          path: test-results/watch-choice
          if-no-files-found: warn
          retention-days: 14
